name: Deploy to Server
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Build
        env:
          VITE_WC_URL: ${{ secrets.VITE_WC_URL }}
          VITE_PAYPAL_CLIENT_ID: ${{ secrets.VITE_PAYPAL_CLIENT_ID }}
        run: npm run build
      - name: Clean old assets
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 198.199.122.63
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: rm -rf /var/www/html/app/assets/*
      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 198.199.122.63
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/*"
          target: "/var/www/html/app"
          strip_components: 1
          timeout: 60s
          command_timeout: 10m
          