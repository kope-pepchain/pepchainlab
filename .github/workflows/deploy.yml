name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          VITE_WC_URL: ${{ secrets.VITE_WC_URL }}
        run: npm run build

      - name: Deploy to server
        uses: appleboy/scp-action@master
        with:
          host: 198.199.122.63
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/*"
          target: "/var/www/html/app"
          strip_components: 1
          timeout: 60s
          command_timeout: 10m
